<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>管理后台系统 - 登录</title>
    <link rel="stylesheet" href="../static/css/modern-login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1 class="login-title">管理后台系统</h1>
                <p class="login-subtitle">管理员登录</p>
            </div>

            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="userID" class="form-label">注册手机号</label>
                    <input
                        type="text"
                        id="userID"
                        name="userID"
                        class="form-input"
                        placeholder="请输入注册手机号"
                        autocomplete="username"
                        required>
                    <div class="error-message" id="userIDError"></div>
                </div>

                <div class="form-group">
                    <label for="passwd" class="form-label">密码</label>
                    <input
                        type="password"
                        id="passwd"
                        name="passwd"
                        class="form-input"
                        placeholder="请输入密码"
                        autocomplete="current-password"
                        required>
                    <div class="error-message" id="passwdError"></div>
                </div>

                <div class="form-group">
                    <label for="verifyCode" class="form-label">验证码</label>
                    <div class="captcha-container">
                        <input
                            type="text"
                            id="verifyCode"
                            name="verifyCode"
                            class="form-input captcha-input"
                            placeholder="请输入验证码"
                            maxlength="4"
                            required>
                        <img
                            id="captchaImage"
                            class="captcha-image"
                            src="/getVerifyImg"
                            alt="验证码"
                            title="点击刷新验证码">
                    </div>
                    <div class="error-message" id="codeError"></div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>记住密码</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span id="btnText">登录</span>
                    <span id="btnLoading" class="loading-spinner" style="display: none;"></span>
                </button>
            </form>

            <div class="login-footer">
                <p class="copyright">© 2025 dongfeng-pay 聚合支付系统</p>
            </div>
        </div>
    </div>

    <script src="../static/js/utils.js"></script>
    <script src="../static/js/login.js"></script>
</body>
</html>
