<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>代理商后台登录</title>
    <meta name="description" content="代理商开放平台登录页面">
    <link rel="stylesheet" href="../static/css/modern-login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-wrapper">
                <!-- 左侧信息面板 -->
                <div class="info-panel">
                    <div class="info-content">
                        <div class="logo-section">
                            <div class="logo-icon">
                                <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect width="64" height="64" rx="12" fill="url(#gradient1)"/>
                                    <path d="M32 20L40 26V38L32 44L24 38V26L32 20Z" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
                                    <path d="M24 26L32 32L40 26" stroke="white" stroke-width="2.5"/>
                                    <path d="M32 32V44" stroke="white" stroke-width="2.5"/>
                                    <defs>
                                        <linearGradient id="gradient1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                                            <stop stop-color="#3b82f6"/>
                                            <stop offset="1" stop-color="#8b5cf6"/>
                                        </linearGradient>
                                    </defs>
                                </svg>
                            </div>
                            <h1 class="platform-title">代理商开放平台</h1>
                            <p class="platform-subtitle">Agent Open Platform</p>
                        </div>

                        <div class="features-list">
                            <div class="feature-item">
                                <div class="feature-icon">✓</div>
                                <div class="feature-text">
                                    <h3>高额分润</h3>
                                    <p>行业领先的分润比例</p>
                                </div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">✓</div>
                                <div class="feature-text">
                                    <h3>商户管理</h3>
                                    <p>便捷的商户管理工具</p>
                                </div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">✓</div>
                                <div class="feature-text">
                                    <h3>数据分析</h3>
                                    <p>实时交易数据统计</p>
                                </div>
                            </div>
                        </div>

                        <div class="info-footer">
                            <p>掌握最新的行业解决方案</p>
                        </div>
                    </div>
                </div>

                <!-- 右侧登录表单 -->
                <div class="form-panel">
                    <div class="form-content">
                        <div class="form-header">
                            <h2 class="form-title">欢迎回来</h2>
                            <p class="form-subtitle">请登录您的代理商账户</p>
                        </div>

                        <form id="loginForm" class="login-form" autocomplete="off">
                            <div class="form-group">
                                <label for="userName" class="form-label">
                                    <span class="label-icon">👤</span>
                                    登录账户
                                </label>
                                <input
                                    type="text"
                                    id="userName"
                                    name="userName"
                                    class="form-input"
                                    placeholder="请输入您的账户"
                                    autocomplete="username"
                                    required>
                                <div class="error-message" id="userNameError"></div>
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label">
                                    <span class="label-icon">🔒</span>
                                    密码
                                </label>
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-input"
                                    placeholder="请输入您的密码"
                                    autocomplete="current-password"
                                    required>
                                <div class="error-message" id="passwordError"></div>
                            </div>

                            <div class="form-group">
                                <label for="captchaCode" class="form-label">
                                    <span class="label-icon">🔐</span>
                                    验证码
                                </label>
                                <div class="captcha-container">
                                    <input
                                        type="text"
                                        id="captchaCode"
                                        name="captchaCode"
                                        class="form-input captcha-input"
                                        placeholder="请输入验证码"
                                        maxlength="6"
                                        required>
                                    <img
                                        id="captchaImage"
                                        class="captcha-image"
                                        src=""
                                        alt="验证码"
                                        title="点击刷新验证码">
                                </div>
                                <input type="hidden" id="captchaId" name="captchaId" value="{{.CaptchaId}}">
                                <div class="error-message" id="captchaError"></div>
                            </div>

                            <button type="submit" class="btn btn-primary" id="loginBtn">
                                <span id="btnIcon" class="btn-icon">🔓</span>
                                <span id="btnText">登录</span>
                                <span id="btnLoading" class="loading-spinner" style="display: none;"></span>
                            </button>
                        </form>

                        <div class="form-footer">
                            <p class="help-text">
                                <a href="/pay_doc.py" class="help-link">接入文档</a>
                                <span class="separator">|</span>
                                <a href="#" class="help-link">忘记密码？</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-footer">
            <p class="copyright">© 2025 dongfeng-pay 代理商开放平台 | 聚合支付解决方案</p>
        </div>
    </div>

    <script src="../static/js/utils.js"></script>
    <script src="../static/js/agent-login.js"></script>
</body>
</html>
